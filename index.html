    <script>
      (function() {
        var isGh = window.location.hostname.endsWith('github.io') || window.location.hostname.includes('pages.dev');
        if (isGh) {
          var p = window.location.pathname;
          if (!p.includes('/docs')) {
            var target = p.endsWith('index.html')
              ? p.replace(/index\.html$/, 'docs/')
              : (p.replace(/\/+$/, '') + '/docs/');
            window.location.replace(target + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-amber-500/20 selection:text-amber-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="if(!window.location.pathname.includes('/docs')){window.location.replace('./docs/');}"></script>
  </body>
